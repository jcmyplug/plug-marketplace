name: Generate lockfile

# One-shot job to create package-lock.json and commit it.
#
# WHY THIS EXISTS AS A WORKFLOW. The repository has never had a lockfile, so
# `npm install` resolves the dependency tree fresh on every build and two builds
# a week apart can differ. That is the opposite of what a pipeline is for: CI is
# supposed to tell you the thing you are about to deploy works, and it cannot do
# that if it is not testing the same tree Vercel will resolve.
#
# The usual fix is "run npm install locally and commit the result", which needs
# Node on someone's machine and a spare five minutes that never arrives. The
# runner already has Node and network access to the registry, so it can do it.
#
# Run it once from the Actions tab, then DELETE this file. It has write access
# to the repository, which is not a permission worth leaving switched on for a
# job that only ever needs to run a single time.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Create and commit package-lock.json
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # --package-lock-only writes the lockfile without installing anything,
      # which is all that is wanted here and is considerably faster.
      - name: Resolve the dependency tree
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show what was resolved
        run: |
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"
          echo "packages: $(node -p "Object.keys(require('./package-lock.json').packages).length")"

      - name: Commit it
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "No change to package-lock.json - nothing to commit."
            exit 0
          fi
          git add package-lock.json
          git commit -m "Add package-lock.json so builds are reproducible (#28)" \
                     -m "Generated by the Generate lockfile workflow. Without a lockfile npm resolves the tree fresh on every build, so CI and Vercel can each install something slightly different and neither is testing what actually ships. Delete .github/workflows/lockfile.yml now that it has run - it holds contents:write and only ever needed to run once."
          git push
